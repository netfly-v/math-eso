<script src="assets/js/topics.js"></script>

  ["отрицательное","negativo","negatiu","enteros"],
  ["модуль","valor absoluto","valor absolut","enteros"],

  ["невозможное","imposible","impossible","probabilidad"]
];
var list = document.getElementById("list");
var input = document.getElementById("q");
function draw() {
  var needle = input.value.trim().toLowerCase();
  list.innerHTML = "";
  WORDS.forEach(function (w) {
    var blob = (w[0] + " " + w[1] + " " + w[2]).toLowerCase();
    if (needle && blob.indexOf(needle) < 0) return;
    var a = document.createElement("a");
    a.className = "card";
    a.href = "temas/" + w[3] + ".html";
    a.innerHTML = "<strong>" + w[0] + "</strong><span>" + w[1] + "</span><small>" + w[2] + "</small>";
    list.appendChild(a);
  });
}
input.addEventListener("input", draw);
draw();
</script>
</body>
